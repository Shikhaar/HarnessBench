name: HarnessBench Continuous Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Target LLM model identifier"
        required: true
        default: "claude-3-5-sonnet-20241022"
      harnesses:
        description: "Comma-separated list of harnesses to benchmark"
        required: true
        default: "mock"
      tasks:
        description: "Tasks to execute ('all' or comma-separated task IDs)"
        required: true
        default: "all"
      repetitions:
        description: "Repetitions per task for statistical stability"
        required: true
        default: "3"
  schedule:
    # Run weekly every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Benchmark Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install HarnessBench & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate Benchmark Tasks Integrity
        run: |
          harnessbench validate-tasks

      - name: Execute HarnessBench
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODEL="${{ github.event.inputs.model || 'claude-3-5-sonnet-20241022' }}"
          HARNESSES="${{ github.event.inputs.harnesses || 'mock' }}"
          TASKS="${{ github.event.inputs.tasks || 'all' }}"
          REPETITIONS="${{ github.event.inputs.repetitions || '1' }}"
          
          harnessbench run \
            --model "$MODEL" \
            --harnesses "$HARNESSES" \
            --tasks "$TASKS" \
            --repetitions "$REPETITIONS"

      - name: Create Pull Request with Benchmark Results
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(benchmark): update leaderboard and results from run ${{ github.run_id }}"
          branch: "benchmark-results-${{ github.run_id }}"
          delete-branch: true
          title: "HarnessBench Run Results: ${{ github.event.inputs.model || 'Scheduled' }} (${{ github.run_id }})"
          body: |
            ## Automated HarnessBench Execution Report
            
            - **Run ID:** ${{ github.run_id }}
            - **Model:** `${{ github.event.inputs.model || 'claude-3-5-sonnet-20241022' }}`
            - **Harnesses:** `${{ github.event.inputs.harnesses || 'mock' }}`
            - **Tasks:** `${{ github.event.inputs.tasks || 'all' }}`
            - **Repetitions:** `${{ github.event.inputs.repetitions || '1' }}`
            
            This pull request contains updated immutable run history in `results/history/` and refreshed presentation metrics in `LEADERBOARD.md`.
            
            Please review the metrics before merging to `main`.
          labels: |
            benchmark
            automated-pr
